threat_actors:
- id: ACT001
  name: Intimate Partner Trafficker
  description: Exercises coercion within existing romantic or family relationship, using isolation, degradation, and threats.
    Typically controls one or few victims through established emotional leverage.
  primary_tactics:
  - TA0002
  - TA0003
  - TA0004
  characteristic_techniques:
  - T0003
  - T0009
  - T0025
  - T0026
  - T0028
  organizational_complexity: low
  typical_victim_count: 1-3
- id: ACT002
  name: Labor Trafficker (Individual Scale)
  description: Operates small-scale labor trafficking often in agriculture, construction, or domestic service, using debt
    bondage and movement restriction as primary coercion.
  primary_tactics:
  - TA0001
  - TA0003
  - TA0004
  characteristic_techniques:
  - T0001
  - T0004
  - T0030
  - T0031
  - T0033
  organizational_complexity: low-medium
