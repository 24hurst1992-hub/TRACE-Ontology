    trafficking_application: Facilitating commercial sex trafficking
    statute_reference:
    - 18 USC 1591 - Sex trafficking
    - State pimping/pandering laws
    victim_indicator:
    - Third party profiting from commercial sex
    - Promotion of sex trafficking
  - nibrs_group: 300 - Crimes Against Society
    nibrs_offense: 35A - Drug/Narcotics Violations
    trafficking_application: Forced drug distribution, drug-maintained control
    statute_reference:
    - 18 USC 1589 - Forced labor with drug dependency
    - Drug trafficking statutes
    victim_indicator:
    - Forced drug dealing by trafficking victim
    - Drug dependency as control
  immigration_trafficking_status:
  - immigration_status: T-Visa (Trafficking Victim Visa)
    eligibility: Victim of severe trafficking in persons with substantial physical or mental abuse
    trafficking_verification: Law enforcement certification of trafficking victimization
    trafficking_indicators:
    - Victim meets definition of severe trafficking
    - Victim cooperates with LE or victim trauma prevents cooperation
    - Victim physically present due to trafficking
    benefits:
    - Work authorization
    - SSN
    - Public benefits access
    - Family reunification potential
  - immigration_status: U-Visa (Crime Victim Visa)
    eligibility: Crime victim with substantial abuse, victim cooperation with LE
    trafficking_application: Victims of trafficking crimes including labor trafficking, document fraud, forced labor
    trafficking_indicators:
    - Victim of trafficking-related crime
    - Substantial abuse
    - LE cooperation
    benefits:
    - Work authorization
    - SSN
    - Public benefits
    - Potential permanent residency
  - immigration_status: VAWA (Violence Against Women Act) Self-Petition
    eligibility: Victim of domestic violence/trafficking with marriage to US citizen/resident
    trafficking_application: Spouse trafficking victims with direct filing ability
    trafficking_indicators:
    - Trafficking within intimate relationship
    - Marriage to perpetrator or related person
    benefits:
    - Independent petition from perpetrator
    - Potential permanent residency
  - immigration_status: Asylum/TPS (Temporary Protected Status)
    eligibility: Victim fleeing persecution in home country including trafficking
    trafficking_application: Trafficking victims from high-trafficking countries
    trafficking_indicators:
    - Persecution risk in home country
    - Inability to return safely
    benefits:
    - Work authorization
    - Protection from deportation
    - Potential permanent residency
  - immigration_status: Cancellation of Removal
    eligibility: Unlawful resident with 10+ years presence, good moral character, extreme hardship family member
    trafficking_application: Undocumented trafficking victims with long-term presence
    trafficking_indicators:
    - Victim unable to obtain other immigration relief
    - Long-term presence
    - Family hardship from removal
    benefits:
    - Permanent residency
    - Right to remain
