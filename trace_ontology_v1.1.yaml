radicalization_pathways:
- id: RAD001
  name: Economic Opportunity Pathway
  description: Individual becomes trafficker through perceived economic opportunity without prior criminal involvement or
    ideological motivation
  preconditions:
  - Economic desperation or ambition
  - Exposure to profitable trafficking operation
  - Weak formal employment alternatives
  progression_stages:
  - stage: Exposure
    description: Individual observes successful trafficking operation and profit-taking
  - stage: Recruitment
    description: Offered role in trafficking operation (recruiter, manager, buyer facilitator)
  - stage: Rationalization
    description: Minimization of victim harm, victim-blaming, profit justification
  - stage: Operational Integration
    description: Assumption of trafficking role with increasing authority and victim contact
  intervention_points:
  - Economic development
  - Legitimate employment
  - Early recruitment refusal
  - Awareness of victim harm
  ideological_justification: Economic rationality, perceived victimlessness of exploitation, blame-shifting to victims
- id: RAD002
  name: Intimate Partner Violence Escalation
  description: Intimate partner perpetrator escalates control from domestic violence to active trafficking exploitation
  preconditions:
  - Domestic violence history
  - Coercive control pattern
  - Economic vulnerability of partner
  - Sense of entitlement to partner control
  progression_stages:
  - stage: Control Establishment
    description: Isolation, financial control, communication restriction established in domestic relationship
  - stage: Escalation
    description: Extension of control to economic exploitation of partner
  - stage: Commercialization
    description: Extension to third-party exploitation (commercial sex, labor) for perpetrator profit
  intervention_points:
  - Domestic violence intervention
  - Financial independence support
  - Safety planning before escalation
  ideological_justification: Spouse/partner ownership, entitlement to control and earnings, patriarchal authority
- id: RAD003
  name: Gang Progression Pathway
  description: Youth gang member progresses from gang involvement to trafficking leadership role
  preconditions:
  - Gang membership
  - Access to victims
  - Territory control
  - Existing violence infrastructure
  progression_stages:
  - stage: Gang Initiation
    description: Youth joins gang, socialized to violence and profit-taking
  - stage: Victim Access
    description: Gang control creates access to vulnerable youth (runaways, other gang members)
  - stage: Trafficking Initiation
    description: Gang introduces member to trafficking as revenue stream
  - stage: Trafficking Leadership
    description: Member develops trafficking operation under gang auspices
  intervention_points:
  - Gang exit programs
  - Youth at-risk prevention
  - Violence interruption
  - Early commercial sexual exploitation intervention
  ideological_justification: Gang profit models, normalized violence, victim as 'property', status through exploitation
- id: RAD004
  name: Organizational Indoctrination Pathway
  description: Individual joins high-control organization (cult, pseudo-religious group) and becomes trafficking perpetrator
    through organizational ideology
  preconditions:
  - Organizational recruitment
  - Isolation from outside information
  - Authority submission
  - Ideological alignment cultivation
  progression_stages:
  - stage: Recruitment
    description: Individual recruited into organization offering meaning/community/spiritual advancement
  - stage: Indoctrination
    description: Systematic belief system internalization justifying exploitation
  - stage: Role Assignment
    description: Assignment of trafficking-related responsibilities within organization
  - stage: Perpetrator Identity Integration
    description: Trafficking role becomes central to identity and purpose
  intervention_points:
  - Exit counseling
  - De-radicalization programs
  - Alternative meaning systems
  - Ideological counter-messaging
  ideological_justification: Organizational ideology positioning exploitation as righteous, victim as spiritually inferior,
    leader as infallible authority
- id: RAD005
  name: Professional/Authority Position Exploitation Pathway
  description: Individual in position of authority (government official, labor broker, service provider) leverages position
    for trafficking profit
  preconditions:
  - Professional position with victim access
  - Weak institutional oversight
  - Normalization of exploitation in institution
  - Corruption opportunity awareness
  progression_stages:
  - stage: Opportunity Recognition
    description: Individual recognizes position enables exploitation without easy detection
  - stage: Incremental Transgression
    description: Small facilitations (overlooking violations, document assistance) with profit incentive
  - stage: Integration
    description: Systematic institutional complicity in trafficking operations
  intervention_points:
  - Institutional oversight strengthening
  - Whistleblower protections
  - Corruption detection
  - Professional ethics training
  ideological_justification: Institutional cynicism, victim as deserving exploitation, profit rationalization, power/position
    entitlement
- id: RAD006
  name: Victim-to-Perpetrator Pathway
  description: Trafficking victim, especially youth, progressively assumes perpetrator role over extended exploitation period
  preconditions:
  - Long-term trafficking victimization
  - Perpetrator approval-seeking
  - Limited viable alternatives
  - Internalized victim blame
  progression_stages:
  - stage: Victim Status
    description: Individual exploited as trafficking victim
  - stage: Survivor Skills Development
    description: Development of coping mechanisms and operational understanding
  - stage: Perpetrator Promotion
    description: Trafficker promotes victim to minor perpetrator role (recruiter, monitor)
  - stage: Perpetrator Identity Integration
    description: Shift from victim identity to perpetrator identity
  intervention_points:
  - Immediate trauma support
  - Alternative pathway provision
  - Victim-to-survivor transition support
  - Prevention of perpetrator progression
  ideological_justification: Trauma bonding with trafficker, normalized exploitation as survival, victim blame internalization
- id: RAD007
  name: Technology-Enabled Perpetrator Pathway
  description: Technically-skilled individual recognizes platform facilitation opportunity and becomes online trafficking
    facilitator
  preconditions:
  - Technical skills
  - Platform development capability
  - Profit motivation
  - Perceived separation from direct victim harm
  progression_stages:
  - stage: Technical Development
    description: Individual develops platform, marketplace, or content delivery system
  - stage: Operational Launch
    description: Platform launches facilitating trafficking transactions
  - stage: Scaling
    description: Expansion of platform user base and transaction volume
  - stage: Institutional Entrenchment
    description: Platform becomes established trafficking infrastructure
  intervention_points:
  - Tech ethics education
  - Platform company responsibility
  - Law enforcement technical capacity
  - User reporting mechanisms
  ideological_justification: Perceived non-violence of online facilitation, victim invisibility, profit motivation, technical
    innovation justification
- id: RAD008
  name: Recruitment Network Pathway
  description: Individual becomes recruitment specialist/broker for trafficking network based on cultural/linguistic connections
    to victim communities
  preconditions:
  - Cultural/linguistic connection to source community
  - Recruitment role offer
  - Profit-per-person incentive structure
  progression_stages:
  - stage: Initial Deception
    description: Individual recruited to place job advertisements and conduct interviews
  - stage: Aware Deception
    description: Individual becomes aware of trafficking nature but continues recruitment
  - stage: Network Integration
    description: Becomes integrated trafficking recruiter with expanded victim network
  intervention_points:
  - Source country awareness programs
  - Recruitment verification systems
  - Legitimate job pathway promotion
  ideological_justification: Economic opportunity exploitation, victim-blaming for 'not verifying', community infiltration
    normalization
- id: RAD009
  name: Coercive Control Pattern Establishment
  description: Individual practices increasingly coercive control (over partner, family member, employee) escalating to trafficking
  preconditions:
  - Exposure to coercive control modeling
  - Perceived entitlement to control others
  - Weak accountability for abuse
  progression_stages:
  - stage: Control Initiation
    description: Individual establishes coercive control in intimate/subordinate relationship
  - stage: Control Deepening
    description: Isolation, financial control, movement restriction becomes comprehensive
  - stage: Commercialization
    description: Controlled person's labor/sexuality becomes profit source
  - stage: Scale Expansion
    description: Expansion to multiple victims under similar control mechanisms
  intervention_points:
  - Coercive control criminalizing legislation
  - Early intimate partner violence intervention
  - Perpetrator accountability
  ideological_justification: Entitled ownership mentality, victim blame for dependency, normalization of control as necessary
