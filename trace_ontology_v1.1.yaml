coercion_methods:
- id: CM001
  biderman_factor: Isolation
  bite_equivalent: Information Control
  name: Isolation
  trafficking_techniques:
  - Communication Isolation
  - Movement Restriction
  - Physical Confinement
  description: Prevention of contact with outside support through confiscated communication devices, prohibition on outside
    contact, or threatened harm to family if contact occurs.
  observable_manifestation: Victim prevented from external contact; no access to independent information about rights or alternatives
- id: CM002
  biderman_factor: Degradation
  bite_equivalent: Emotional Manipulation; Thought Reform
  name: Degradation
  trafficking_techniques:
  - Psychological Degradation
  - Identity Control
  description: Systematic humiliation, insults, and attacks on identity reducing victim self-worth and capacity for autonomous
    decision-making.
  observable_manifestation: Victim subjected to systematic humiliation; identity attacked; shame internalized
- id: CM003
  biderman_factor: Monopolization of Perception
  bite_equivalent: Information Control; Thought Reform
  name: Monopolization of Perception
  trafficking_techniques:
  - Communication Isolation
  - Information Control
  description: Overwhelming attention through abuse or overstimulation, controlling all information flow so trafficker interpretation
    becomes victim understanding.
  observable_manifestation: Victim receives all information through trafficker; reality-testing impossible; trafficker interpretation
    becomes victim understanding
- id: CM004
  biderman_factor: Induced Debility
  bite_equivalent: Behavioral Control
  name: Induced Debility
  trafficking_techniques:
  - Labor Extraction
  - Movement Restriction
  description: Fatigue, malnourishment, or physiological compromise reducing capacity for resistance through exhaustion and
    deprivation.
  observable_manifestation: Victim exhausted, malnourished, or physiologically compromised; capacity for resistance reduced
- id: CM005
  biderman_factor: Threats
  bite_equivalent: Emotional Manipulation; Behavioral Control
  name: Threats
  trafficking_techniques:
  - Family-Based Threats
  - Deportation Threats
  - Social Ostracism Threats
  description: Explicit and implicit danger communicated to maintain behavioral compliance through threatened consequences
    to victim or loved ones.
  observable_manifestation: Victim experiences constant danger perception; behavioral compliance maintained through threatened
    consequences
- id: CM006
  biderman_factor: Occasional Indulgences
  bite_equivalent: Emotional Manipulation
  name: Occasional Indulgences
  trafficking_techniques:
  - Inconsistent Punishment
  description: Unpredictable rewards creating psychological dependence, preventing victim ability to predict or control consequences.
  observable_manifestation: Victim cannot predict which behaviors earn reward vs. punishment; psychological dependence on
    trafficker for safety and comfort
- id: CM007
  biderman_factor: Demonstrating Omnipotence
  bite_equivalent: Behavioral Control; Thought Reform
  name: Demonstrating Omnipotence
  trafficking_techniques:
  - Physical Confinement
  - Economic Control
  - Institutional Cooperation
  description: Displaying trafficker power and victim powerlessness across all domains of life, creating hopelessness regarding
    escape.
  observable_manifestation: Victim experiences trafficker power over all domains of life; hopelessness regarding escape possibilities
- id: CM008
  biderman_factor: Demanding Denunciation
  bite_equivalent: Thought Reform
  name: Demanding Denunciation
  trafficking_techniques:
  - Criminally Coerced Labor
  - Family Involvement
  description: Forcing victims to blame themselves, report on other victims, or participate in trafficking activities, creating
    co-perpetrator status.
  observable_manifestation: Victim forced to participate in trafficking others or illegal activity; victim becomes co-perpetrator,
    complicating escape and reporting
