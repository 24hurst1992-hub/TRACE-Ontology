meta:
  name: TRACE Ontology
  version: '1.1'
  full_name: Trafficking Recognition, Analysis & Countermeasure Engine
  description: TRACE (Tactics, Roles, Actors, Coercion, and Ecology) - A structured ontology for human trafficking tactics,
    techniques, and procedures modeled on the MITRE ATT&CK framework. Developed for cross-disciplinary use across law enforcement,
    clinical practice, intelligence analysis, social work, and victim advocacy.
  date: '2026-04-06'
  license: CC BY-NC-SA 4.0
  authors:
  - Anthony Hurst
  source_frameworks:
  - MITRE ATT&CK v18
  - Polaris Project Typology of Modern Slavery (2017)
  - UNODC Trafficking Indicators Framework
  - ILO Forced Labor Indicators (2025)
  - Zimmerman et al. Stages Model
  - Biderman Chart of Coercion (1957)
  - Hassan BITE Model
  - Crime Script Analysis
  roles:
  - id: LE
    name: Law Enforcement
  - id: INTEL
    name: Intelligence Analyst
  - id: SANE
    name: SANE/Forensic Examiner
  - id: SW
    name: Social Worker
  - id: VA
    name: Victim Advocate
tactics:
- id: TA0001
  name: Targeting
  phase: Pre-trafficking
  description: Techniques for identifying, profiling, and selecting individuals vulnerable to trafficking. Traffickers engage
    in rational decision-making involving cost-benefit analysis, exploiting structural vulnerabilities (poverty, prior foster
    involvement, homelessness, immigration status) and individual vulnerabilities (learning disabilities, mental illness,
    prior trauma, substance use disorders, social isolation).
  zimmerman_stage: Pre-Trafficking
  crime_script_track: Victim Recruitment
  role_relevance:
    LE: Identifies targeting patterns to predict future victimization; links victim selection to perpetrator profile
    INTEL: Maps vulnerability scanning operations; identifies targeting infrastructure
    SANE: Understands pre-exploitation vulnerability context for trauma-informed assessment
    SW: Identifies at-risk populations for prevention; recognizes vulnerability factors in current clients
    VA: Understands how survivor was identified and targeted; informs empowerment narrative
- id: TA0002
  name: Recruitment
  phase: Transition Phase
  description: Methods of initial engagement and the transition from normal social contact to trafficking relationship. Recruitment
    is where coercion, if not already present, typically begins. Crime script analysis identifies recruitment as a distinct
    event with specific decision points.
  zimmerman_stage: Recruitment/Transit
  crime_script_track: Victim Recruitment / Financial Transactions
  role_relevance:
    LE: Identifies recruitment methods for prosecution; traces initial contact and grooming evidence
    INTEL: Maps recruitment networks and methodologies; identifies recruitment infrastructure
    SANE: Documents injuries and presentations from early-stage coercion and boundary violation
    SW: Recognizes grooming patterns in clients; identifies early intervention opportunities
    VA: Helps survivors understand manipulation they experienced; reduces self-blame
- id: TA0003
  name: Coercion
  phase: Early/Sustained Trafficking
  description: Psychological, economic, and physical mechanisms maintaining victim compliance and preventing escape. Grounded
    in Biderman's framework of coercive control and Hassan's BITE model of authoritarian control.
  zimmerman_stage: Exploitation (onset)
  crime_script_track: Control and Coercion
  role_relevance:
    LE: Documents control mechanisms as evidence of force/fraud/coercion elements; identifies co-conspirators in control apparatus
    INTEL: Maps control infrastructure; identifies surveillance and communication networks
    SANE: Documents physical evidence of control (injuries, malnutrition, substance effects); provides trauma-informed context
    SW: Assesses current control mechanisms for safety planning; sequences intervention to address most dangerous controls
      first
    VA: Helps survivor understand control dynamics; validates experience; supports autonomy restoration
- id: TA0004
  name: Exploitation
  phase: Sustained Trafficking
  description: Techniques for extracting labor, controlling economic output, and maintaining continuous harm through forced
    work, commodification, organ trafficking, criminally coerced labor, and economic exploitation.
  zimmerman_stage: Exploitation
  crime_script_track: Advertisement and Promotion / Financial Transactions
  role_relevance:
    LE: Documents exploitation activity for prosecution; identifies venues, buyers, and facilitators
    INTEL: Maps exploitation operations, revenue streams, and market dynamics
    SANE: Documents physical and psychological effects of exploitation; provides forensic evidence
    SW: Assesses exploitation impact for service planning; addresses immediate needs
    VA: Centers survivor narrative; connects exploitation to legal remedies; supports healing
- id: TA0005
  name: Concealment
  phase: Throughout Operation
  description: Operational security techniques traffickers use to avoid detection, maintain legal distance from victim harm,
    and evade accountability. Includes victim normalization, witness management, record suppression, and institutional cooperation.
  zimmerman_stage: Exploitation (maintenance)
  crime_script_track: Control and Coercion / Geographic Movement
  role_relevance:
    LE: Identifies concealment techniques to overcome during investigation; targets operational security vulnerabilities
    INTEL: Maps concealment infrastructure; identifies corruption networks and counter-intelligence operations
    SANE: Understands why victims may present inconsistently due to concealment pressure
    SW: Recognizes concealment tactics that may prevent disclosure or service engagement
    VA: Supports survivor through disclosure barriers created by concealment tactics
- id: TA0006
  name: Scaling
  phase: Expansion Phase
  description: Techniques for expanding operations, multiplying trafficking capacity without proportional increases in trafficker
    personnel, or moving victims across jurisdictions. Includes franchising, supply chain integration, victim cascading, and
    technology leverage.
  zimmerman_stage: Exploitation (financial)
  crime_script_track: Financial Transactions
  role_relevance:
    LE: Follows the money to identify network scope; builds financial predicate crime charges; asset forfeiture
    INTEL: Maps financial networks; identifies money flow patterns; connects seemingly separate operations
    SANE: Documents financial exploitation evidence (stolen identity, forced financial activity)
    SW: Addresses survivor financial harm (credit damage, debt, identity theft recovery)
    VA: Supports financial recovery; connects to victim compensation; documents economic harm
techniques:
- id: T0001
  name: Social Media Vulnerability Scanning
  tactic_ids:
  - TA0001
  description: Threat actor uses social media platforms to identify potential victims by scanning for vulnerability indicators
    including posts about family conflict, homelessness, financial distress, substance use, depression, loneliness, or desire
    for relationships/employment.
  platforms:
  - Instagram
  - TikTok
  - Snapchat
  - Facebook
  - Twitter/X
  - Dating apps
  sub_techniques:
  - id: T0001.001
    name: Hashtag/Keyword Monitoring
    description: 'Monitoring specific hashtags (#runaway, #homeless, #needhelp) or keywords indicating vulnerability'
  - id: T0001.002
    name: Location-Based Targeting
    description: Using geolocation features to identify targets near shelters, group homes, bus stations
  - id: T0001.003
    name: AI-Assisted Profiling
    description: Using automated tools or AI to scan and profile potential victims at scale
  indicators:
    LE:
    - Perpetrator social media search history showing vulnerability terms
    - Multiple initial contacts with vulnerable youth from same account
    - Geolocation data showing proximity to vulnerable populations
    INTEL:
    - Pattern of social media accounts contacting vulnerable youth
    - Common platform usage across multiple cases
    - Bot-like behavior in initial outreach
    SANE:
    - Victim reports initial contact via social media
    - Victim describes being 'found' online during vulnerable period
    SW:
    - Client reports online relationship that began during crisis period
    - Pattern of older contacts messaging vulnerable youth clients
    VA:
    - Survivor describes being targeted online
    - Survivor reports sharing vulnerability online before trafficking
  mitigations:
  - Digital literacy education
  - Platform safety features
  - Social media monitoring by guardians
  - Prevention outreach on platforms
  source_frameworks:
  - Polaris Project
  - UNODC
- id: T0002
  name: Prior Victimization Exploitation
  tactic_ids:
  - TA0001
  description: Threat actor identifies individuals with prior abuse, trafficking, or exploitation history and targets them
    specifically because prior victimization creates vulnerability patterns (trauma responses, distrust of systems, normalized
    exploitation).
  sub_techniques:
  - id: T0002.001
    name: Re-trafficking of Known Victims
    description: Targeting individuals previously identified as trafficking victims who have exited services
  - id: T0002.002
    name: Domestic Violence Victim Targeting
    description: Targeting individuals fleeing domestic violence who lack resources and support
  - id: T0002.003
    name: Child Abuse Survivor Targeting
    description: Targeting individuals with childhood abuse history showing vulnerability indicators
  indicators:
    LE:
    - Victim has prior trafficking case history
    - Perpetrator aware of victim's abuse history
    - Victim identified through trafficking recovery program
    INTEL:
    - Pattern of re-victimization in case data
    - Perpetrator targeting domestic violence shelters or recovery programs
    SANE:
    - Complex trauma presentation suggesting prior exploitation
    - Physical findings consistent with long-term abuse history
    SW:
    - Client with trafficking history presenting with new exploitation
    - Pattern of re-exploitation following service exit
    VA:
    - Survivor reports being targeted because trafficker knew their history
    - Re-trafficking following service engagement
  mitigations:
  - Long-term survivor support
  - Safety planning for service exits
  - Re-trafficking prevention programs
  source_frameworks:
  - Zimmerman et al.
  - Polaris Project
- id: T0003
  name: Institutional Targeting
  tactic_ids:
  - TA0001
  description: Threat actor targets populations in institutions (foster care, group homes, juvenile justice, shelters) where
    vulnerability is elevated and guardianship is fragmented.
  sub_techniques:
  - id: T0003.001
    name: Foster Care System Targeting
    description: Targeting youth in foster care with documented higher trafficking rates
  - id: T0003.002
    name: Group Home/Shelter Targeting
    description: Targeting youth in group homes, residential treatment, or homeless shelters
  - id: T0003.003
    name: Juvenile Justice System Targeting
    description: Targeting incarcerated or probation-supervised youth
  - id: T0003.004
    name: Institutional Staff Recruitment
    description: Recruiting institutional staff to identify and deliver vulnerable youth
  indicators:
    LE:
    - Perpetrator with institutional employment
    - Youth victimization clustered around same institution
    - Staff coordination with perpetrator
    INTEL:
    - Geographic clustering of victims from specific institutions
    - Perpetrator association with institution
    - Staff turnover patterns
    SANE:
    - Victim from institutional background
    - Exploitation timing following institutional placement
    SW:
    - Client missing from placement
    - Client contact with adults from placement
    - Staff misconduct indicators
    VA:
    - Survivor reports institutional vulnerability
    - Exploitation occurring while in care
  mitigations:
  - Institutional screening protocols
  - Youth-staff interaction oversight
  - Trafficking awareness training for staff
  - Missing youth rapid response
  source_frameworks:
  - Polaris Project
  - Shared Hope International
- id: T0004
  name: Geographic Targeting
  tactic_ids:
  - TA0001
  description: Threat actor identifies geographic areas with high victim concentration, limited law enforcement, or characteristics
    facilitating trafficking (border regions, tourism corridors, rural isolation).
  sub_techniques:
  - id: T0004.001
    name: Border Region Targeting
    description: Targeting near-border populations with migration vulnerability and jurisdictional complexity
  - id: T0004.002
    name: Tourism Corridor Targeting
    description: Targeting areas with transient populations, hospitality industry, and cash economies
  - id: T0004.003
    name: Rural Area Targeting
    description: Targeting rural areas with limited law enforcement and social services
  - id: T0004.004
    name: Jurisdictional Fragmentation Exploitation
    description: Operating across jurisdictional boundaries to evade coordinated response
  indicators:
    LE:
    - Geographic clustering of trafficking cases
    - Victim sourcing from specific origin areas
    - Cross-jurisdictional operations
    INTEL:
    - Perpetrator movement patterns
    - Operational hubs in specific geographies
    - Border proximity patterns
    SANE:
    - Victim exploitation in specific geographic area
    - Victim movement from origin to exploitation area
    SW:
    - Client origin in high-trafficking region
    - Client displacement from origin community
    VA:
    - Survivor narrative of geographic movement
    - Language/culture barrier from relocation
  mitigations:
  - Cross-jurisdictional task forces
  - Community awareness in high-risk areas
  - Service access in underserved areas
  source_frameworks:
  - UNODC
  - Routine Activity Theory
- id: T0005
  name: Economic Vulnerability Assessment
  tactic_ids:
  - TA0001
  description: Threat actor identifies individuals in economic distress and offers economic opportunity as exploitation entry
    point.
  sub_techniques:
  - id: T0005.001
    name: False Employment Advertising
    description: Posting attractive job opportunities with false promises of wages, conditions, or type of work
  - id: T0005.002
    name: Housing Provision Dependency
    description: Offering housing to create dependency and debt
  - id: T0005.003
    name: Microfinance/Debt Creation
    description: Providing loans at exploitative terms to create debt servitude
  - id: T0005.004
    name: Gift-Based Dependency
    description: Providing gifts and money to establish gratitude and obligation
  indicators:
    LE:
    - False employment advertisements
    - Housing provided by perpetrator
    - Debt records
    - Victim relocation for 'employment'
    INTEL:
    - Job/housing recruitment operations
    - False advertising campaigns
    - Economic inducement infrastructure
    SANE:
    - Victim reports economic motivation for entering situation
    - Economic desperation background
    SW:
    - Client economic vulnerability prior to trafficking
    - Debt-based arrangements
    - Economic control during exploitation
    VA:
    - Survivor narrative of economic promises
    - False employment
    - Debt entrapment
  mitigations:
  - Employment verification resources
  - Financial literacy education
  - Housing assistance for vulnerable populations
  source_frameworks:
  - Polaris Project
  - ILO
- id: T0006
  name: Immigration Status Exploitation
  tactic_ids:
  - TA0001
  description: Threat actor specifically targets individuals with precarious immigration status, leveraging deportation fear
    and limited service access.
  sub_techniques:
  - id: T0006.001
    name: Visa Program Exploitation
    description: Targeting holders of temporary work visas (H-2A, H-2B, J-1) whose status depends on employer
  - id: T0006.002
    name: Undocumented Immigrant Targeting
    description: Targeting individuals without legal immigration status
  - id: T0006.003
    name: Refugee/Asylum Seeker Targeting
    description: Targeting individuals in refugee or asylum-seeking status
  indicators:
    LE:
    - Perpetrator aware of victim immigration status
    - Threats of deportation
    - Visa tied to employer/perpetrator
    INTEL:
    - Recruitment patterns in immigrant communities
    - Visa fraud indicators
    - Immigration-based control networks
    SANE:
    - Patient with immigration-related fear preventing disclosure
    - Trauma presentation with deportation anxiety
    SW:
    - Client with precarious immigration status
    - Employment tied to immigration sponsor
    - Fear of law enforcement
    VA:
    - Survivor fears deportation
    - Immigration status used as leverage
    - T-visa eligibility assessment needed
  mitigations:
  - T-visa education and access
  - Immigration legal services
  - Law enforcement immigration screening protocols
  source_frameworks:
  - UNODC
  - ILO
  - Polaris Project
- id: T0007
  name: Substance Dependence Targeting
  tactic_ids:
  - TA0001
  description: Threat actor identifies individuals with substance use disorders and targets them for exploitation, leveraging
    addiction as both recruitment tool and control mechanism.
  sub_techniques:
  - id: T0007.001
    name: Drug Supply as Recruitment
    description: Providing drugs to establish dependency relationship before exploitation
  - id: T0007.002
    name: Recovery Program Targeting
    description: Targeting individuals in or recently exiting substance use treatment
  indicators:
    LE:
    - Perpetrator providing drugs to victim
    - Drug supply chain connected to trafficking operation
    - Victim with substance use history
    INTEL:
    - Drug trafficking and human trafficking operational overlap
    - Substance-based control patterns
    SANE:
    - Substance use evidence in forensic exam
    - Withdrawal symptoms
    - Injection site patterns
    SW:
    - Client with substance use disorder in exploitation context
    - Relapse coinciding with exploitation
    VA:
    - Survivor reports drugs provided by trafficker
    - Substance-based control narrative
  mitigations:
  - Integrated trafficking/substance use screening
  - Harm reduction with trafficking education
  - Co-occurring treatment programs
  source_frameworks:
  - Polaris Project
- id: T0008
  name: LGBTQ+ Youth Targeting
  tactic_ids:
  - TA0001
  description: Threat actor specifically targets LGBTQ+ youth experiencing family rejection, homelessness, or identity-related
    isolation.
  sub_techniques:
  - id: T0008.001
    name: Family Rejection Exploitation
    description: Targeting youth expelled from home due to sexual orientation or gender identity
  - id: T0008.002
    name: Identity Acceptance Manipulation
    description: Offering acceptance and affirmation as recruitment tool for isolated LGBTQ+ youth
  indicators:
    LE:
    - Youth victim with family rejection history
    - Perpetrator targeting LGBTQ+ spaces or online communities
    INTEL:
    - Patterns of LGBTQ+ youth victimization
    - Targeting of LGBTQ+ community spaces
    SANE:
    - Youth presenting with gender dysphoria and exploitation indicators
    - Injuries consistent with hate-based and exploitation violence
    SW:
    - LGBTQ+ youth client experiencing homelessness with exploitation indicators
    - Family rejection as precipitating factor
    VA:
    - Survivor narrative of identity-based vulnerability
    - Acceptance used as manipulation
  mitigations:
  - LGBTQ+ affirming shelters
  - Family reconciliation programs
  - LGBTQ+-specific trafficking prevention
  source_frameworks:
  - Polaris Project
- id: T0009
  name: Romeo/Loverboy Method
  tactic_ids:
  - TA0002
  description: Threat actor initiates romantic or pseudo-romantic relationship with target, establishing emotional attachment
    and dependency before progressively introducing exploitation.
  sub_techniques:
  - id: T0009.001
    name: In-Person Romantic Approach
    description: Meeting target in person and initiating conventional romantic relationship
  - id: T0009.002
    name: Online Romantic Grooming
    description: Initiating relationship through dating apps or social media with rapid emotional escalation
  - id: T0009.003
    name: Trauma Bond Formation
    description: Alternating affection and abuse to create psychological dependency
  indicators:
    LE:
    - Rapid romantic relationship preceding exploitation
    - Significant age gap
    - Financial gifts early in relationship
    - Perpetrator with multiple victim-partners
    INTEL:
    - Pattern of romantic recruitment across cases
    - Same perpetrator methodology across victims
    SANE:
    - Victim describes boyfriend/partner as trafficker
    - Reluctance to identify partner as perpetrator
    - Physical injuries from partner
    SW:
    - Client in controlling romantic relationship with exploitation indicators
    - Rapid relationship escalation with older partner
    VA:
    - Survivor describes love and manipulation from same person
    - Trauma bond preventing separation
    - Difficulty identifying experience as trafficking
  mitigations:
  - Healthy relationship education
  - Teen dating violence prevention
  - Trauma bond awareness
  source_frameworks:
  - Polaris Project
  - Crime Script Analysis
- id: T0010
  name: False Employment Promises
  tactic_ids:
  - TA0002
  description: Threat actor recruits victims through false or misleading employment offers, promising legitimate work that
    either doesn't exist or differs substantially from reality.
  sub_techniques:
  - id: T0010.001
    name: Modeling/Entertainment Scam
    description: Promising modeling, acting, or entertainment careers
  - id: T0010.002
    name: Domestic Work Deception
    description: Promising legitimate housekeeping or childcare work
  - id: T0010.003
    name: Agricultural Labor Fraud
    description: Promising agricultural work with false wage and condition promises
  - id: T0010.004
    name: Restaurant/Hospitality Recruitment
    description: Promising restaurant or hotel work through deceptive recruitment
  indicators:
    LE:
    - Job advertisements with unrealistic promises
    - Recruitment through informal channels
    - Victims from same recruitment source
    INTEL:
    - Recruitment operation infrastructure
    - False advertising patterns
    - Labor contractor networks
    SANE:
    - Victim reports being recruited for different work than performed
    - Work conditions inconsistent with promises
    SW:
    - Client recruited through employment promises
    - Work conditions violating labor standards
    - Wage theft
    VA:
    - Survivor describes bait-and-switch employment
    - Promised conditions vs actual conditions
    - Debt accumulated from recruitment
  mitigations:
  - Employment verification resources
  - Labor trafficking awareness campaigns
  - Worker rights education
  source_frameworks:
  - Polaris Project
  - ILO
- id: T0011
  name: Family-Based Recruitment
  tactic_ids:
  - TA0002
  description: Family member facilitates recruitment, selling or offering family member (often child) to trafficker, or family
    unit operating as trafficking enterprise.
  sub_techniques:
  - id: T0011.001
    name: Parental Trafficking
    description: Parent selling or facilitating exploitation of child
  - id: T0011.002
    name: Extended Family Brokerage
    description: Extended family member acting as intermediary between victim and trafficker
  - id: T0011.003
    name: Family Debt Settlement
    description: Family member sold/traded to settle family debt or obligation
  indicators:
    LE:
    - Family member involvement in trafficking arrangement
    - Financial transaction between family and perpetrator
    - Family knowledge of exploitation
    INTEL:
    - Familial trafficking patterns
    - Intergenerational trafficking networks
    SANE:
    - Child/youth with family-facilitated exploitation history
    - Injuries consistent with exploitation at young age
    SW:
    - Child welfare case with trafficking indicators
    - Family complicity in exploitation
    - Intergenerational trauma patterns
    VA:
    - Survivor identifies family member as facilitator
    - Complex loyalty and trauma around family involvement
  mitigations:
  - Child welfare trafficking screening
  - Family support services
  - Mandatory reporting protocols
  source_frameworks:
  - Polaris Project
  - Shared Hope International
- id: T0012
  name: Peer Recruitment
  tactic_ids:
  - TA0002
  description: Existing victims or associates recruit new victims through peer relationships, often under direction of trafficker.
  sub_techniques:
  - id: T0012.001
    name: Bottom Girl/Bottom Boy System
    description: Most trusted/senior victim recruits and manages other victims
  - id: T0012.002
    name: Social Circle Infiltration
    description: Using recruited victim to access their social network for additional victims
  indicators:
    LE:
    - Victim acting as recruiter under coercion
    - Social network analysis showing peer recruitment chains
    INTEL:
    - Recruitment chains in network analysis
    - Peer-to-peer recruitment patterns
    SANE:
    - Victim describes being recruited by friend/peer
    - Victim may also be acting as recruiter
    SW:
    - Client involved in both victim and recruitment roles
    - Social network with multiple trafficking-involved individuals
    VA:
    - Survivor guilt about recruiting others
    - Complex victim-offender intersectionality
  mitigations:
  - Peer support programs in high-risk settings
  - Victim-offender intersectionality awareness training
  source_frameworks:
  - Polaris Project
  - Shared Hope International
- id: T0013
  name: Online Grooming
  tactic_ids:
  - TA0002
  description: Progressive online relationship building designed to establish trust, test boundaries, normalize exploitation,
    and eventually facilitate in-person contact and exploitation.
  sub_techniques:
  - id: T0013.001
    name: Gaming Platform Grooming
    description: Using online gaming platforms to build relationships with vulnerable youth
  - id: T0013.002
    name: Social Media Grooming
    description: Using social media direct messages and engagement to build attachment
  - id: T0013.003
    name: Sextortion Escalation
    description: Obtaining intimate images then using them as blackmail leverage for further exploitation
  indicators:
    LE:
    - Online communication records showing grooming progression
    - Age-inappropriate contact patterns
    - Image-based extortion evidence
    INTEL:
    - Platform-specific grooming patterns
    - Account networks used for grooming
    - Cross-platform targeting
    SANE:
    - Victim describes online relationship preceding exploitation
    - Sextortion evidence
    SW:
    - Youth client with concerning online relationship
    - Image-sharing with older contact
    - Behavioral changes following online contact
    VA:
    - Survivor describes progressive online manipulation
    - Shame related to shared images
    - Difficulty identifying manipulation as exploitation
  mitigations:
  - Digital safety education
  - Platform reporting features
  - Parent/guardian digital literacy
  - Age verification improvements
  source_frameworks:
  - Polaris Project
  - UNODC
- id: T0014
  name: Drug-Facilitated Recruitment
  tactic_ids:
  - TA0002
  description: Threat actor uses drug provision as recruitment and initial control tool, creating dependency that facilitates
    exploitation.
  sub_techniques:
  - id: T0014.001
    name: Party/Social Drug Introduction
    description: Providing drugs in social settings to establish dependency
  - id: T0014.002
    name: Drug-for-Sex Exchange Initiation
    description: Establishing pattern of drugs exchanged for sexual activity
  indicators:
    LE:
    - Drug provision as part of trafficking operation
    - Perpetrator drug supply chain
    - Victim substance dependency created by perpetrator
    INTEL:
    - Drug-trafficking and human-trafficking operational overlap
    - Drug supply as recruitment infrastructure
    SANE:
    - Substance use evidence in exam
    - Dependency timeline corresponding to trafficking timeline
    SW:
    - Client substance use beginning at point of exploitation
    - Substance provided by exploiter
    VA:
    - Survivor reports drugs provided as control tool
    - Addiction developed during trafficking
  mitigations:
  - Substance use screening for trafficking
  - Integrated treatment programs
  - Prevention education
  source_frameworks:
  - Polaris Project
- id: T0015
  name: Religious/Spiritual Manipulation
  tactic_ids:
  - TA0002
  description: Threat actor uses religious authority, spiritual beliefs, or cult dynamics to recruit and establish authority
    over victims.
  sub_techniques:
  - id: T0015.001
    name: Cult Recruitment
    description: Recruiting into high-control group where exploitation occurs under spiritual justification
  - id: T0015.002
    name: Religious Authority Abuse
    description: Using position of religious authority to access and exploit vulnerable congregation members
  - id: T0015.003
    name: Juju/Voodoo/Spiritual Oath Binding
    description: Using spiritual oaths or rituals to create fear-based compliance (particularly in West African trafficking)
  indicators:
    LE:
    - Religious organization involvement in trafficking
    - Spiritual authority leveraged for exploitation
    - Ritual evidence
    INTEL:
    - High-control group trafficking patterns
    - Religious organization as trafficking front
    SANE:
    - Ritual-related injuries or marks
    - Spiritual fear preventing disclosure
    SW:
    - Client in high-control group with exploitation indicators
    - Spiritual manipulation as control mechanism
    VA:
    - Survivor describes spiritual control
    - Religious guilt as barrier to leaving
    - Fear of spiritual consequences
  mitigations:
  - Cult awareness education
  - Exit counseling services
  - Religious community trafficking training
  source_frameworks:
  - Hassan BITE Model
  - Biderman
- id: T0016
  name: Debt-Based Recruitment
  tactic_ids:
  - TA0002
  description: Threat actor creates or assumes debt obligation from victim or victim's family, then leverages debt as justification
    for forced labor or sexual exploitation.
  sub_techniques:
  - id: T0016.001
    name: Smuggling Debt Conversion
    description: Converting migration/smuggling costs into trafficking debt
  - id: T0016.002
    name: Recruitment Fee Inflation
    description: Charging inflated fees for job placement, visa processing, or travel
  - id: T0016.003
    name: Family Debt Transfer
    description: Inheriting or assuming family member's debt obligation
  indicators:
    LE:
    - Debt documentation
    - Financial records showing inflated charges
    - Debt used as control mechanism
    INTEL:
    - Debt-based trafficking networks
    - Recruitment fee patterns
    - Financial infrastructure for debt management
    SANE:
    - Victim reports debt as reason for continued exploitation
    - Financial stress indicators
    SW:
    - Client describes debt obligation preventing escape
    - Wages withheld for 'debt repayment'
    VA:
    - Survivor describes debt as central control mechanism
    - Legal assistance for debt relief needed
  mitigations:
  - Debt invalidation legal remedies
  - Financial counseling
  - Worker rights education about illegal debt practices
  source_frameworks:
  - ILO
  - UNODC
  - Polaris Project
- id: T0017
  name: Forced Marriage/Bride Trafficking
  tactic_ids:
  - TA0002
  description: Threat actor uses marriage as recruitment and control mechanism, where victim is forced into marriage for sexual
